[package]
changelog = "CHANGELOG.md"
versioned_files = ["go.mod"]
ignore_go_major_versioning = true

[changes]
ignore_conventional_commits = true

[[workflows]]
name = "document-change"

[[workflows.steps]]
type = "CreateChangeFile"

[[workflows]]
name = "prepare-release"

[[workflows.steps]]
type = "Command"
command = "git switch -c release"

[[workflows.steps]]
type = "PrepareRelease"

[[workflows.steps]]
type = "Command"
command = "git commit -m \"chore: prepare release $version\""
variables = { "$version" = "Version" }

[[workflows.steps]]
type = "Command"
command = "git push --force --set-upstream origin release"

[workflows.steps.variables]
"$version" = "Version"

[[workflows.steps]]
type = "CreatePullRequest"
base = "master"

[workflows.steps.title]
template = "chore: prepare release $version"
variables = { "$version" = "Version" }

[workflows.steps.body]
template = "This PR was created automatically. Merging it will create a new release for $version\n\n$changelog"
variables = { "$changelog" = "ChangelogEntry", "$version" = "Version" }

[[workflows]]
name = "tag"

[[workflows.steps]]
type = "Command"
command = """
set -e
if git rev-parse -q --verify "refs/tags/v$version^{commit}" >/dev/null; then
  if [ "$(git rev-parse "refs/tags/v$version^{commit}")" != "$(git rev-parse HEAD)" ]; then
    echo "tag v$version already exists and does not point to HEAD" >&2
    exit 1
  fi
  echo "tag v$version already points to HEAD, skipping"
else
  git tag "v$version"
fi
git push origin "v$version"
"""
shell = true
variables = { "$version" = "Version" }

[github]
owner = "SiaFoundation"
repo = "cluster"
